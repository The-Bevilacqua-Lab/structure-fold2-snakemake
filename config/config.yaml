# -----------------------------------------------------------------------
# structure-fold2-snakemake config template
#
# Copy this file, fill in the keys for your organism/experiment, and point
# --configfile at your copy. Every key is documented below; optional keys
# can be deleted entirely if you don't need them.
# -----------------------------------------------------------------------

# Required. Tab-separated samplesheet. Columns: sample, condition, r1,
# and optionally ID (replicate group) and run (sequencing run). See
# config/samplesheet_example.tsv and the Snakefile's samplesheet comment
# for the exact column semantics and defaults if ID/run are omitted.
samplesheet: config/samplesheet_example.tsv

# Required. Where pipeline outputs (reactivity, QC, plots) are written.
output_dir: results

# Directory for intermediate/scratch files (alignments, trimmed reads,
# per-replicate RT-stop counts). Can point at scratch storage -- these are
# not needed once reactivity.react/.csv are produced. Default: "tmp".
tmp_dir: tmp

# Optional. Read-trimming tool: "cutadapt" (default -- StructureFold2's
# fastq_trimmer.py, workflow/scripts/StructureFold3/fastq_trimmer.py) or
# "fastp" (workflow/rules/read_prep.smk's trim_reads_fastp, via the
# snakemake-wrappers bio/fastp wrapper). Both trim the same 3' adapter
# (GATCGGAAGAGCACACGTCTG); fastp additionally does --trim_poly_g and quality/
# length filtering. Omit to keep the default (cutadapt).
trimmer: cutadapt

# ---------------------------------------------------------------------------
# Transcriptome source: "file" or "gffread"
#   file    - provide a pre-built transcriptome FASTA via the transcriptome
#             key below (one sequence per transcript you want reactivity
#             for). Simplest option if you already have one.
#   gffread - build the transcriptome from a genome + GFF/GTF annotation
#             with gffread. Requires genome and gff below; every transcript
#             in the GFF is extracted unless keep_longest_isoform is set.
# ---------------------------------------------------------------------------
transcript_source: file

# Used when transcript_source: file
transcriptome: path/to/transcriptome.fa

# Used when transcript_source: gffread
# genome: path/to/genome.fa
# gff: path/to/annotation.gff3

# Optional (transcript_source: gffread only, default false). When true, AGAT
# first keeps only the longest isoform per gene so gffread produces one
# transcript per locus; otherwise the GFF is used as given.
# keep_longest_isoform: true

# Optional. Genome-level GTF annotation + the genome FASTA above (or a
# separate one) enable the transcript_position_annotations.csv output,
# labelling each transcript position 5UTR/CDS/3UTR with codon position.
# Requires BOTH keys; omit either to skip this output entirely.
# genome: path/to/genome.fa
# annotation_gtf: path/to/annotation.gtf

# Optional. FASTA of a positive-control sequence (e.g. a construct with a
# known secondary structure) to append to the transcriptome so it's
# included in alignment and reactivity calculation like any other
# transcript. positive_control_name must match that sequence's FASTA
# header exactly -- it drives the generic alignment-% QC in
# workflow/rules/qc.smk. If positive_control_name is literally "p4p6",
# the pipeline ALSO plots reactivity directly onto the known p4p6
# structure diagram (workflow/rules/positive_control.smk,
# resources/p4p6/) -- that structure plot only exists for p4p6; any other
# positive control still gets the alignment-% QC but no structure plot.
# positive_control_fasta: resources/p4p6/p4p6.fa
# positive_control_name: p4p6

# Optional. FASTA of ncRNA sequences (e.g. rRNAs/tRNAs) to append to the
# transcriptome before mapping, to soak up off-target reads.
# ncrna_fasta: path/to/ncrna.fa


# ---------------------------------------------------------------------------
# Optional. Exclude specific sample(s) from the +DMS or -DMS combining step
# (combine_rtsc_plus/minus and their pooled/pooled_by_temperature variants,
# see workflow/rules/rtsc.smk) without dropping them from the
# samplesheet entirely -- an excluded sample is still trimmed, mapped, and
# rtsc-counted individually, and still shows up in per-sample QC
# (specificity_<sample>.csv, alignment_stats_summary.tsv); it's just left
# out of whichever channel's combined_plus.rtsc/combined_minus.rtsc feeds
# the reactivity calculation. Useful for dropping a technically bad
# replicate (e.g. one flagged by
# notebooks/dms_rtsc_normalization_diagnostics.ipynb) from the -DMS
# background without losing its QC trail. Sample names must match the
# samplesheet's "sample" column exactly. Each key is independent --
# excluding a sample from exclude_samples_minus does not affect its use in
# +DMS, and vice versa. Omit either/both (or leave as an empty list) to
# exclude nothing.
# ---------------------------------------------------------------------------
# exclude_samples_plus:
#   - S1_ambient
# exclude_samples_minus:
#   - S4_heat

# ---------------------------------------------------------------------------
# Replicate pooling before the reactivity calculation.
#   none  (default) - each replicate keeps its own +DMS and -DMS RT-stop
#                      counts; one reactivity output per replicate (ID).
#   minus            - pool -DMS across every replicate into one shared
#                       background; +DMS stays per-replicate. Still one
#                       reactivity output per replicate.
#   plus             - pool +DMS across every replicate into one shared
#                       treated signal; -DMS stays per-replicate. Still one
#                       reactivity output per replicate.
#   both             - pool BOTH channels across every replicate. Collapses
#                       to exactly ONE reactivity output for the whole run
#                       (under the synthetic ID "pooled"), since there's
#                       only one pair of pooled +DMS/-DMS left. Not
#                       compatible with a samplesheet "temperature" column
#                       (see heat_correction_suffix below) -- use
#                       both_by_temperature instead.
#   both_by_temperature - like "both", but pools +DMS/-DMS within each
#                       temperature group separately instead of across the
#                       whole sheet. Requires a "temperature" samplesheet
#                       column. Collapses to one reactivity output PER
#                       temperature (under synthetic IDs
#                       "pooled_<temperature>"), leaving the two
#                       temperatures to heat-correct against each other.
#   minus_all_plus_by_temperature - pool -DMS across EVERY replicate,
#                       temperature included, into one shared background
#                       (like "minus"), while +DMS is pooled only WITHIN
#                       each temperature group (like the +DMS half of
#                       both_by_temperature). Requires a "temperature"
#                       samplesheet column; same one-output-per-temperature
#                       shape as both_by_temperature.
# See workflow/rules/rtsc.smk for the full mechanics.
# ---------------------------------------------------------------------------
pool_replicates: none

# ---------------------------------------------------------------------------
# Optional. Correct the +DMS RT-stops for 3' coverage bias (e.g. from poly(A)
# selection) before the reactivity calculation, using the -DMS library as the
# reference (workflow/rules/bias_correction.smk). Per reactivity ID:
#   1. take the top 3_prime_bias_n_transcripts protein-coding transcripts as
#      the training set -- ONE set shared by every ID, ranked by each
#      transcript's lowest +DMS RT-stop coverage across all IDs (written to
#      {output_dir}/qc/3prime_bias_correction/training_transcripts.tsv);
#   2. regress log(+DMS depth / -DMS depth) (per-nucleotide samtools depth)
#      on distance from the 3' end, relative position (position / length)
#      and their interaction -- one set of coefficients for every transcript;
#   3. divide every protein-coding transcript's +DMS RT-stops by the fitted
#      exp(...) bias (then rescale by one global constant so the corrected
#      total matches the raw total), and use those counts for reactivity.
# Non-protein-coding transcripts (ncRNA, positive control) are left as-is.
# QC per ID in {output_dir}/{id}/3prime_bias_correction/: model.tsv
# (coefficients + R^2), coverage_residual_metagene.png (log-ratio / fit /
# residual, and depth metagene before/after), rtsc_metagene_before_after.png
# (+DMS RT-stop metagene before/after vs the -DMS reference).
# ---------------------------------------------------------------------------
3_prime_bias_correction: false

# -DMS reference for the model: "pooled" (default) -- every -DMS sample
# (after exclude_samples_minus), across replicates and temperatures -- or
# "independent" -- each ID's own -DMS samples (for a pooled/pooled_<temperature>
# ID, the -DMS samples of that same pool).
# 3_prime_bias_reference: pooled

# Number of top +DMS-covered protein-coding transcripts to fit on. Default 2500.
# 3_prime_bias_n_transcripts: 2500

# GTF or GFF3 used to find protein-coding transcripts (transcript_biotype /
# transcript_type / biotype "protein_coding", or GFF3 mRNA features without a
# biotype). Defaults to annotation_gtf, then gff.
# 3_prime_bias_annotation: path/to/annotation.gtf

# Relative-position bins for the QC metagene plots. Default 50.
# 3_prime_bias_bins: 50

# ---------------------------------------------------------------------------
# Optional. Combine per-sample base-specificity plots from several separate
# pipeline runs (e.g. different organisms/genotypes/conditions, each with
# its own output_dir + samplesheet) into one comparison figure. Omit
# entirely if you only care about a single run's own specificity_plot.png.
# ---------------------------------------------------------------------------
# specificity_comparison_runs:
#   - name: "Wild-type"
#     output_dir: results_wildtype
#     samplesheet: config/samples_wildtype.tsv
#   - name: "Mutant"
#     output_dir: results_mutant
#     samplesheet: config/samples_mutant.tsv

# ---------------------------------------------------------------------------
# Optional. Heat-correct reactivities for the same construct/transcriptome
# probed at two different temperatures (e.g. a Structure-seq experiment run
# at 30C and at 55C). Higher temperatures increase overall reagent
# reactivity independent of any real structural difference, so
# react_heat_correct.py rescales both temperatures' reactivity.react files
# onto a common overall-signal scale, per-replicate. Before scaling, both
# temperatures are first restricted to transcripts with RT-stop coverage
# >= 1 in the pooled +DMS samples of BOTH temperatures, so the two
# conditions being corrected share the exact same transcript set (see
# qc/heat_correction_shared_transcripts.txt).
#
# Enabled by adding an optional "temperature" column to the samplesheet
# (see the Snakefile's samplesheet comment) -- not a config key. This key
# only controls the output filename suffix (results in
# {id}/heat_correction/reactivity_<suffix>.react); omit it to keep the
# default.
# ---------------------------------------------------------------------------
# heat_correction_suffix: corrected

# Optional. When true, ALSO run heat correction on every transcript present
# in both temperatures' plain reactivity.react, with no RT-stop coverage
# threshold at all -- alongside the normal coverage-qualified correction
# above -- so the two can be compared (results in
# {id}/heat_correction_all_transcripts/reactivity_<suffix>.{react,csv}, plus
# qc/heat_correction_all_transcripts_scale_factors.log next to
# qc/heat_correction_scale_factors.log for the coverage-qualified run).
# Only meaningful when heat correction itself is enabled (see above).
# heat_correction_compare_all_transcripts: true


# ---------------------------------------------------------------------------
# Optional. Estimate per-transcript relative abundance (RPKM and/or TPM)
# from the untreated (-DMS) RT-stop counts, via StructureFold2's own
# rtsc_abundances.py (see calculate_transcript_abundance in
# workflow/rules/abundance.smk). One {id}/abundance_<mode>.csv per
# requested mode; a single string or a list of "RPKM"/"TPM" are both
# accepted. Omit entirely (or leave as an empty list) to skip this output.
# ---------------------------------------------------------------------------
# transcript_abundance: TPM

# ---------------------------------------------------------------------------
# Optional. Number of relative-position bins (5' to 3', each transcript split
# into this many equal-width bins) used by the metagene coverage plots
# (workflow/rules/metagene.smk). Default 100.
# ---------------------------------------------------------------------------
# metagene_bins: 100
