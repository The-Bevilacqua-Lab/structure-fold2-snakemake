# =============================================================================
# structure-fold2-snakemake config
#
# Copy this file, edit it, and run with --configfile <your copy>. Only section 1 is required;
# everything else shows its default (commented out) and can be left alone.
# Unsure which options you need? See docs/choosing_options.md.
# This file is also loaded as the defaults for every run, so keep the uncommented values as they are
# here and make changes in your copy.
# =============================================================================

# --- 1. Required --------------------------------------------------------------

samplesheet: config/samplesheet_example.tsv   # TSV: sample, condition, r1 [, ID, run, temperature, genotype] (docs/samplesheet.md)
output_dir: results                           # results: reactivity, QC, report
tmp_dir: tmp                                  # intermediates (alignments, RT-stop counts): use scratch space

# Reference transcriptome, built one of two ways:
#   file    - a transcriptome FASTA you already have (first word of each header = transcript ID)
#   gffread - extracted from a genome FASTA + GFF3/GTF
transcript_source: file
transcriptome: path/to/transcriptome.fa       # transcript_source: file
# genome: path/to/genome.fa                   # transcript_source: gffread
# gff: path/to/annotation.gff3                # transcript_source: gffread (GFF3 or GTF)
# cds_only: true                              # gffread: keep only transcripts with a CDS
# keep_longest_isoform: false                 # gffread: one isoform (the longest) per gene, with AGAT

# --- 2. Reads and alignment ---------------------------------------------------

# cutadapt: StructureFold2's fastq_trimmer.py (5' TGAACAGCGACTAGGCTCTTCA + 3' GATCGGAAGAGCACACGTCTG
#           adapters, Q30, >= 20 nt). fastp: one 3' adapter (fastp_adapter), poly-G tails, >= fastp_min_length.
trimmer: cutadapt
# fastp_adapter: GATCGGAAGAGCACACGTCTG
# fastp_min_length: 20
# max_mismatch: 3                             # mismatches/indels allowed per alignment (sam_filter.py)
# keep_intermediates: false                   # true keeps trimmed FASTQs and SAMs (they are large)

# --- 3. Replicates ------------------------------------------------------------

# What the reactivity is calculated from (docs/choosing_options.md#replicates):
#   none   - each replicate ID: its own +DMS and its own -DMS (default)
#   minus  - each replicate ID's +DMS, all -DMS samples pooled into one background
#   plus   - all +DMS pooled, each replicate's own -DMS
#   both   - everything pooled: one reactivity, ID "pooled"
#   both_by_temperature           - (temperature column) both pooled within each temperature: IDs "pooled_<t>"
#   minus_all_plus_by_temperature - (temperature column) -DMS pooled over everything, +DMS within each temperature
pool_replicates: none

# Samples left out of the +DMS or -DMS pool / replicate (still aligned and in the per-sample QC)
# exclude_samples_plus: [S1]
# exclude_samples_minus: [S4]

# --- 4. Reactivity ------------------------------------------------------------

# Scaling of each channel's ln(stops + 1) before the -DMS subtraction (docs/methods.md §8):
#   all - mean over all positions (StructureFold2)
#   gu  - mean over G/U positions, which DMS leaves unmodified (transcripts with < reactivity_min_gu G/U are skipped)
# reactivity_normalization: all
# reactivity_min_gu: 20

# Divide +DMS RT stops by a fitted 3' coverage bias, e.g. after poly(A) selection (docs/3_prime_end_bias.md)
3_prime_bias_correction: false
# 3_prime_bias_reference: pooled              # -DMS depth reference: pooled (all -DMS) or independent (each ID's own)
# 3_prime_bias_training: top_n                # top_n, or all_covered (every transcript >= 3_prime_bias_min_coverage in all IDs)
# 3_prime_bias_n_transcripts: 2500            # top_n: training transcripts
# 3_prime_bias_min_coverage: 1                # all_covered: coverage threshold
# 3_prime_bias_annotation: path/to/annotation.gtf   # protein_coding biotypes; default annotation_gtf, then gff
# 3_prime_bias_bins: 50                       # bins in the QC metagene plots

# Depth-matched reactivity, for comparing libraries of different depth (docs/depth_matching.md)
# depth_matching: false
# depth_matching_draws: 100
# depth_matching_match_minus: true            # also thin the -DMS backgrounds to the same depth
# depth_matching_shards: 1                    # > 1: split into that many one-core cluster jobs (same result)
# depth_matching_roc_trim3: 50
# depth_matching_normalization: all           # default: reactivity_normalization
# depth_matching_min_gu: 20                   # default: reactivity_min_gu

# Heat correction is switched on by a 'temperature' column in the samplesheet (two values), not here.
# heat_correction_suffix: corrected           # -> {id}/heat_correction/reactivity_corrected.csv
# heat_correction_compare_all_transcripts: false   # also correct every transcript, without the coverage filter

# --- 5. Extra sequences in the reference --------------------------------------

# A spike-in of known structure. Name = its FASTA ID; "p4p6" adds the P4-P6 structure plots and ROC.
# positive_control_fasta: resources/p4p6/p4p6.fa
# positive_control_name: p4p6
# p4p6_roc_trim3: 50                          # last N (3') positions left out of the ROC

# rRNA / other ncRNA / lncRNA sets, so their reads map there instead of to similar mRNA, and are
# counted in the read-composition QC. Recommended with a coding-only transcriptome. Each set is a
# FASTA (<set>_fasta) or an annotation (<set>_gff or <set>_gtf) extracted from <set>_genome
# (default: genome); from an annotation only non-coding transcripts are kept (<set>_noncoding_only).
# ncrna_fasta: path/to/ncrna.fa
# ncrna_gtf: path/to/full_annotation.gtf      # rRNAs in it (biotype rRNA) are labelled rRNA
# ncrna_genome: path/to/genome.fa
# ncrna_noncoding_only: true
# lncrna_fasta: path/to/lncrna.fa
# rrna_fasta: path/to/rrna.fa
# read_composition_priority: [rRNA, mRNA, lncRNA]   # pie slice for a read that hits several types

# --- 6. Extra outputs ---------------------------------------------------------

# genome + annotation_gtf: label every transcript position 5UTR / CDS / 3UTR (transcript_position_annotations.csv)
# annotation_gtf: path/to/annotation.gtf
# transcript_abundance: [TPM]                 # RPKM and/or TPM from the -DMS RT stops
# rnaframework_xml: false                     # also write reactivities as RNA Framework XML (rf-norm format)
# report_title: structure-fold2-snakemake QC report
# metagene_bins: 100

# Map the reads that miss the transcriptome to the genome (HISAT2) and report where they land
# genome_check: false
# genome_check_annotation: path/to/full_annotation.gtf   # default annotation_gtf, then gff
# genome_check_hisat2_index: path/to/index/prefix        # default: built from genome (~1 h)
# genome_check_organelles: "(chr)?(Mt|M|MT|mito.*|mitochondri.*|Pt|C|chloroplast.*|plastid.*|plastome.*)"
# genome_check_locus_gap: 50
# genome_check_top_loci: 200

# One specificity figure across several finished runs
# specificity_comparison_runs:
#   - {name: Wild-type, output_dir: results_wt, samplesheet: config/samples_wt.tsv}
#   - {name: Mutant, output_dir: results_mut, samplesheet: config/samples_mut.tsv}

# --- 7. Two genotypes (docs/pipeline.md §11G) ---------------------------------

# Two genomes (species or cultivars), each read mapped to its own genotype's transcripts. Replaces
# transcript_source / genome / gff, and needs a 'genotype' samplesheet column.
# genotypes:
#   nipponbare:
#     genome: path/to/nipponbare.fa
#     gtf: path/to/nipponbare.gtf             # or gff:
#   indica:
#     genome: path/to/indica.fa
#     gff: path/to/indica.gff3
# transcript_matching: path/to/matching.tsv   # default: transcripts matched by identical ID
# pool_minus_across_genotypes: false          # needs pool_replicates: minus
# cross_genotype_min_identity: 0.9
# cross_genotype_coordinate_map: path/to/coordinate_matching.tsv.gz
# cross_genotype_coordinate_map_ref: nipponbare
# genotype_comparison_min_positions: 20
